# USE CASE: a near-real-time rule that cannot stay near-real-time. Continuous
# detections must reference one table and use no join, union or externaldata.
# This one joins, so it is downgraded to the shortest scheduled frequency - a
# real detection-latency change that someone has to accept.
# EXPECT: NeedsWork - downgraded from continuous, naming 'join'
id: 5a1e0005-0000-4000-8000-000000000005
name: Sample - NRT rule with a join
description: NRT rule whose query disqualifies it from continuous mode.
severity: High
kind: NRT
queryFrequency: PT5M
queryPeriod: PT5M
tactics:
  - Execution
relevantTechniques:
  - T1059
query: |
  DeviceProcessEvents
  | join kind=inner DeviceNetworkEvents on DeviceId
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
